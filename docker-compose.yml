# Run the whole platform: http://localhost:3000 (dashboard) + http://localhost:8000 (API).
services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/data:/app/data          # SQLite db + fitted artifacts persist here
    env_file:
      - path: ./Backend/.env              # copy from Backend/.env.example (optional)
        required: false
    healthcheck:
      # /api/v1/ready/ reports 503 until an active model version is loaded.
      test: ["CMD", "python", "-c", "import urllib.request as u; print(u.urlopen('http://localhost:8000/api/v1/ready/', timeout=3).status)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle (browser fetches go straight to :8000).
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      # Server components fetch the backend over the compose network.
      - API_BASE_INTERNAL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
